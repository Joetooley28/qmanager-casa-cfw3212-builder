name: Mark Casa package release verified

on:
  workflow_dispatch:
    inputs:
      casa_tag:
        description: Casa package release tag, for example v0.1.10-cfw3212.12
        required: true
      verified_by:
        description: Verification label/name
        required: true
        default: JTooley

permissions:
  contents: read

env:
  PACKAGE_REPO: Joetooley28/qmanager-casa-cfw3212-package

jobs:
  mark-verified:
    name: Mark existing package release verified
    runs-on: ubuntu-latest
    environment: official-package-release
    env:
      GH_TOKEN: ${{ secrets.PACKAGE_RELEASE_TOKEN }}

    steps:
      - name: Mark release verified
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REPOSITORY" != "Joetooley28/qmanager-casa-cfw3212-builder" ]; then
            echo "Official release edits are only allowed from Joetooley28/qmanager-casa-cfw3212-builder." >&2
            exit 1
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing required environment secret: PACKAGE_RELEASE_TOKEN" >&2
            exit 1
          fi

          tag="${{ github.event.inputs.casa_tag }}"
          verified_by="${{ github.event.inputs.verified_by }}"
          today="$(date -u +%Y-%m-%d)"

          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*-cfw3212.[0-9]*) ;;
            *)
              echo "Invalid Casa package tag: $tag" >&2
              exit 1
              ;;
          esac

          release_json="$RUNNER_TEMP/release.json"
          gh release view "$tag" --repo "$PACKAGE_REPO" --json name,body,isPrerelease > "$release_json"

          python3 - "$release_json" "$verified_by" "$today" "$RUNNER_TEMP/release-title.txt" "$RUNNER_TEMP/release-notes-verified.md" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          release_json, verified_by, today, title_out, body_out = sys.argv[1:6]
          data = json.loads(Path(release_json).read_text())

          title = data.get("name") or ""
          title = re.sub(r"\s*\((?:Actions|bot)-built, unverified\)", "", title, flags=re.IGNORECASE)
          title = re.sub(r"\s*\(router-verified by [^)]+\)$", "", title, flags=re.IGNORECASE)
          Path(title_out).write_text(f"{title} (router-verified by {verified_by})\n")

          body = data.get("body") or ""
          verified = f"Actions-built prerelease. This package has been live-router verified by {verified_by} on {today}."
          top_line = f"Router-verified by {verified_by} on {today}."

          body = re.sub(
              r"(?:Actions|Bot)-built prerelease\. Not yet live-router verified by JTooley\.",
              verified,
              body,
              flags=re.IGNORECASE,
          )

          body = re.sub(
              r"Router-verified by [^\n]+ on \d{4}-\d{2}-\d{2}\.\n\n",
              "",
              body,
              count=1,
          )

          if verified not in body:
              body = f"{verified}\n\n{body}".rstrip() + "\n"

          body = f"{top_line}\n\n{body}".rstrip() + "\n"
          Path(body_out).write_text(body)
          PY

          title="$(cat "$RUNNER_TEMP/release-title.txt")"

          gh release edit "$tag" \
            --repo "$PACKAGE_REPO" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes-verified.md" \
            --prerelease

          echo "Marked $tag as router-verified by $verified_by."
