name: Build Casa CFW-3212 package

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Upstream RM520N version to convert, or latest
        required: true
        default: latest
      casa_build:
        description: Casa build suffix number
        required: true
        default: "7"
      dry_run:
        description: Build and stage assets without publishing
        required: true
        type: boolean
        default: true
      force:
        description: "If the release tag already exists, overwrite its assets. Use only after deciding to replace that prerelease."
        required: true
        type: boolean
        default: false
      create_release:
        description: Publish the staged assets to the official package repo
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: casa-cfw3212-build-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO_SLUG: dr-dolomite/QManager-RM520N
  PACKAGE_REPO: Joetooley28/qmanager-casa-cfw3212-package

jobs:
  build:
    name: Build converted Casa package
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.scheduled_check.outputs.should_build }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      casa_build: ${{ steps.resolve.outputs.casa_build }}
      casa_tag: ${{ steps.resolve.outputs.casa_tag }}
      tar_name: ${{ steps.resolve.outputs.tar_name }}
      sha_name: ${{ steps.resolve.outputs.sha_name }}
      changelog_name: ${{ steps.resolve.outputs.changelog_name }}
      sha256: ${{ steps.stage.outputs.sha256 }}
      dry_run: ${{ steps.inputs.outputs.dry_run }}
      create_release: ${{ steps.inputs.outputs.create_release }}
      force: ${{ steps.inputs.outputs.force }}
      release_exists: ${{ steps.safety.outputs.release_exists }}
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_UPSTREAM_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upstream_version || 'latest' }}
      INPUT_CASA_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.casa_build || '1' }}
      INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'true' }}
      INPUT_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || 'false' }}
      INPUT_CREATE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release || 'false' }}

    steps:
      - name: Check out builder repo
        uses: actions/checkout@v4

      - name: Normalize inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "dry_run=${INPUT_DRY_RUN:-true}"
            echo "create_release=${INPUT_CREATE_RELEASE:-false}"
            echo "force=${INPUT_FORCE:-false}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve upstream app release
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          requested="${INPUT_UPSTREAM_VERSION:-latest}"
          casa_build="${INPUT_CASA_BUILD:-1}"

          case "$casa_build" in
            ''|*[!0-9]*) echo "casa_build must be a positive integer" >&2; exit 1 ;;
          esac

          gh api "repos/${UPSTREAM_REPO_SLUG}/releases?per_page=100" > "$RUNNER_TEMP/upstream-releases.json"

          python3 - "$RUNNER_TEMP/upstream-releases.json" "$requested" <<'PY' > "$RUNNER_TEMP/resolve.env"
          import json
          import re
          import sys
          from pathlib import Path

          releases = json.loads(Path(sys.argv[1]).read_text())
          requested = sys.argv[2]

          def real_app_release(rel):
              tag = rel.get("tag_name") or ""
              if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
                  return False
              assets = {asset.get("name") for asset in rel.get("assets", [])}
              return {"qmanager.tar.gz", "sha256sum.txt"}.issubset(assets)

          if requested == "latest":
              for rel in releases:
                  if real_app_release(rel):
                      print(f"upstream_tag={rel['tag_name']}")
                      break
              else:
                  raise SystemExit("No upstream RM520N app release contains qmanager.tar.gz and sha256sum.txt")
          else:
              tag = requested if requested.startswith("v") else f"v{requested}"
              for rel in releases:
                  if (rel.get("tag_name") or "") == tag:
                      if not real_app_release(rel):
                          raise SystemExit(f"{tag} is not an app release with qmanager.tar.gz and sha256sum.txt")
                      print(f"upstream_tag={tag}")
                      break
              else:
                  raise SystemExit(f"Upstream release not found: {tag}")
          PY

          . "$RUNNER_TEMP/resolve.env"
          casa_tag="${upstream_tag}-cfw3212.${casa_build}"
          tar_name="qmanager-cfw3212-${casa_tag}.tar.gz"
          sha_name="qmanager-cfw3212-${casa_tag}.sha256"
          changelog_name="qmanager-cfw3212-${casa_tag}-changelog.json"

          {
            echo "upstream_tag=$upstream_tag"
            echo "casa_build=$casa_build"
            echo "casa_tag=$casa_tag"
            echo "tar_name=$tar_name"
            echo "sha_name=$sha_name"
            echo "changelog_name=$changelog_name"
          } >> "$GITHUB_OUTPUT"

          printf 'Selected upstream app release: %s\n' "$upstream_tag"
          printf 'Casa release tag: %s\n' "$casa_tag"

      - name: Check scheduled release drift
        id: scheduled_check
        shell: bash
        run: |
          set -euo pipefail

          upstream_tag="${{ steps.resolve.outputs.upstream_tag }}"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            {
              echo "should_build=true"
              echo "reason=manual run requested"
            } >> "$GITHUB_OUTPUT"
            echo "Manual workflow run; continuing to build $upstream_tag."
            exit 0
          fi

          gh api "repos/${PACKAGE_REPO}/releases?per_page=100" > "$RUNNER_TEMP/package-releases.json"

          package_state="$(
            python3 - "$RUNNER_TEMP/package-releases.json" "$upstream_tag" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          releases = json.loads(Path(sys.argv[1]).read_text())
          current_upstream = sys.argv[2]
          current_packaged = False
          latest_packaged_upstream = ""

          for rel in releases:
              tag = rel.get("tag_name") or ""
              match = re.fullmatch(r"(v\d+\.\d+\.\d+)-cfw3212\.(\d+)", tag)
              if not match:
                  continue
              upstream = match.group(1)
              assets = {asset.get("name") for asset in rel.get("assets", [])}
              required = {
                  f"qmanager-cfw3212-{tag}.tar.gz",
                  f"qmanager-cfw3212-{tag}.sha256",
              }
              if required.issubset(assets):
                  if not latest_packaged_upstream:
                      latest_packaged_upstream = upstream
                  if upstream == current_upstream:
                      current_packaged = True

          print(f"current_packaged={'true' if current_packaged else 'false'}")
          print(f"latest_packaged_upstream={latest_packaged_upstream}")
          PY
          )"
          eval "$package_state"

          if [ "${current_packaged:-false}" = "true" ]; then
            message="No new QManager release out yet. Latest upstream app release is still ${upstream_tag}, and a Casa package already exists."
            {
              echo "should_build=false"
              echo "reason=$message"
            } >> "$GITHUB_OUTPUT"
            echo "$message"
            {
              echo "## No Casa Build Needed"
              echo
              echo "$message"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          message="New upstream app release detected: ${upstream_tag}. Previous packaged upstream: ${latest_packaged_upstream:-none}."
          {
            echo "should_build=true"
            echo "reason=$message"
          } >> "$GITHUB_OUTPUT"
          echo "$message"

      - name: Set up Bun
        if: steps.scheduled_check.outputs.should_build == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Set up Go
        if: steps.scheduled_check.outputs.should_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Check release safety gates
        if: steps.scheduled_check.outputs.should_build == 'true'
        id: safety
        shell: bash
        run: |
          set -euo pipefail

          dry_run="${INPUT_DRY_RUN:-true}"
          create_release="${INPUT_CREATE_RELEASE:-false}"
          force="${INPUT_FORCE:-false}"
          casa_tag="${{ steps.resolve.outputs.casa_tag }}"

          release_exists=false
          existing_prerelease=""
          if gh release view "$casa_tag" --repo "$PACKAGE_REPO" >/dev/null 2>&1; then
            release_exists=true
            existing_prerelease="$(gh release view "$casa_tag" --repo "$PACKAGE_REPO" --json isPrerelease --jq '.isPrerelease')"
            if [ "$existing_prerelease" != "true" ]; then
              echo "Release $casa_tag already exists but is not a prerelease." >&2
              echo "Refusing to modify stable releases from automation." >&2
              exit 1
            fi
          fi

          if [ "$create_release" = "true" ] && [ "$dry_run" != "true" ] && [ "$release_exists" = "true" ] && [ "$force" != "true" ]; then
            echo "Release $casa_tag already exists in $PACKAGE_REPO." >&2
            echo "Refusing to overwrite release assets without force=true." >&2
            exit 1
          fi

          {
            echo "dry_run=$dry_run"
            echo "create_release=$create_release"
            echo "force=$force"
            echo "release_exists=$release_exists"
            echo "existing_prerelease=$existing_prerelease"
          } >> "$GITHUB_OUTPUT"

          printf 'dry_run=%s create_release=%s force=%s release_exists=%s existing_prerelease=%s\n' \
            "$dry_run" "$create_release" "$force" "$release_exists" "$existing_prerelease"

      - name: Build Casa package off-device
        if: steps.scheduled_check.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          upstream_tag="${{ steps.resolve.outputs.upstream_tag }}"
          casa_build="${{ steps.resolve.outputs.casa_build }}"
          ref_dir="$RUNNER_TEMP/casa-reference"
          mkdir -p "$ref_dir" "$ref_dir/scripts/usr/bin"
          cp qmanager/casa_conversion/templates/install_cfw3212.sh "$ref_dir/install_cfw3212.sh"
          cp qmanager/casa_conversion/vendor/scripts/usr/bin/qmanager_ping "$ref_dir/scripts/usr/bin/qmanager_ping"
          chmod 755 "$ref_dir/scripts/usr/bin/qmanager_ping"

          UPSTREAM_REPO="https://github.com/${UPSTREAM_REPO_SLUG}.git" \
          UPSTREAM_API="https://api.github.com/repos/${UPSTREAM_REPO_SLUG}/releases" \
          CASA_BUILD="$casa_build" \
            bash qmanager/casa_conversion/build-casa-port.sh \
              --version "$upstream_tag" \
              --ref-dir "$ref_dir" \
              --force \
              --skip-build

          target_dir="qmanager/qmanager_work_${upstream_tag}_casa"
          if [ -f "$target_dir/build-discord-bot.sh" ]; then
            chmod +x "$target_dir/build-discord-bot.sh"
          fi

          # --- AI-56: bundle the offline Entware dependency closure ----------
          # Stage the full runtime closure (libc/loader, libssl, lighttpd +
          # modules, sudo) under dependencies/entware/ so the package installs
          # on a box with no WAN. The sudo .ipk is repacked with its ELF
          # interpreter + RPATH repointed to /usrdata/opt and setuid preserved,
          # so privileged CGIs work on a read-only-root box with no /opt symlink.
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          entware_base="http://bin.entware.net/armv7sf-k3.2"
          dep_dir="$target_dir/dependencies/entware"
          rm -rf "$dep_dir"
          mkdir -p "$dep_dir"
          curl -fsSL "$entware_base/Packages.gz" -o /tmp/entware-Packages.gz
          gzip -dc /tmp/entware-Packages.gz > /tmp/entware-Packages.txt
          python3 - <<'PY' > /tmp/entware-closure.txt
          import re
          pkgs = {}
          cur = {}
          for line in open("/tmp/entware-Packages.txt"):
              line = line.rstrip("\n")
              if line.startswith("Package: "):
                  cur = {"Package": line[9:]}
              elif line.startswith("Depends: "):
                  cur["Depends"] = line[9:]
              elif line.startswith("Filename: "):
                  cur["Filename"] = line[10:]
              elif line == "":
                  if cur.get("Package"):
                      pkgs[cur["Package"]] = cur
                  cur = {}
          if cur.get("Package"):
              pkgs[cur["Package"]] = cur
          targets = ["libpcre2", "libopenssl", "lighttpd", "lighttpd-mod-cgi",
                     "lighttpd-mod-openssl", "lighttpd-mod-redirect",
                     "lighttpd-mod-proxy", "sudo"]
          seen = set()
          def visit(p):
              if p in seen:
                  return
              if p not in pkgs:
                  raise SystemExit("Entware dependency not in index: " + p)
              seen.add(p)
              for d in pkgs[p].get("Depends", "").split(","):
                  d = re.sub(r"\(.*?\)", "", d).strip()
                  if d:
                      visit(d)
          for t in targets:
              visit(t)
          for p in sorted(seen):
              print(pkgs[p]["Filename"])
          PY
          mapfile -t ent_files < /tmp/entware-closure.txt
          [ "${#ent_files[@]}" -gt 0 ] || { echo "Empty Entware closure" >&2; exit 1; }
          for f in "${ent_files[@]}"; do
            curl -fsSL "$entware_base/$f" -o "$dep_dir/$f"
          done
          echo "Downloaded ${#ent_files[@]} Entware .ipk(s) into $dep_dir"

          # Pre-patch the sudo .ipk in place: repoint loader + RPATH to
          # /usrdata/opt and restore setuid (patchelf clears it). libsudo_util.so
          # lives in .../lib/sudo, so RPATH must include that dir too.
          sudo_ipk="$(ls "$dep_dir"/sudo_*.ipk)"
          work="$(mktemp -d)"
          tar xzf "$sudo_ipk" -C "$work"
          mkdir -p "$work/data"
          tar xzf "$work/data.tar.gz" -C "$work/data"
          patchelf --set-interpreter /usrdata/opt/lib/ld-linux.so.3 \
                   --set-rpath /usrdata/opt/lib:/usrdata/opt/lib/sudo \
                   "$work/data/opt/bin/sudo"
          chmod 4755 "$work/data/opt/bin/sudo"
          ( cd "$work/data" && tar czf "$work/data.tar.gz" --owner=0 --group=0 ./ )
          ( cd "$work" && tar czf "$GITHUB_WORKSPACE/$sudo_ipk" ./debian-binary ./control.tar.gz ./data.tar.gz )
          rm -rf "$work"

          # Verify the repacked sudo: setuid+root in the tar header and the ELF
          # interpreter actually repointed.
          python3 - "$sudo_ipk" <<'PY'
          import os, subprocess, sys, tarfile, tempfile
          ipk = sys.argv[1]
          d = tempfile.mkdtemp()
          with tarfile.open(ipk) as t:
              t.extract("./data.tar.gz", d)
          with tarfile.open(os.path.join(d, "data.tar.gz")) as t:
              m = t.getmember("./opt/bin/sudo")
              assert m.mode & 0o4000, "setuid bit missing on repacked sudo"
              assert m.uid == 0 and m.gid == 0, "repacked sudo not owned by root"
              t.extract("./opt/bin/sudo", d)
          out = subprocess.check_output(
              ["readelf", "-l", os.path.join(d, "opt/bin/sudo")], text=True)
          assert "/usrdata/opt/lib/ld-linux.so.3" in out, "sudo interpreter not repointed"
          print("Repacked sudo .ipk OK: setuid+root, interp=/usrdata/opt/lib/ld-linux.so.3")
          PY
          # --- end AI-56 bundling --------------------------------------------

          cd "$target_dir"
          bun install
          CASA_BUILD="$casa_build" bun run package
          test -f qmanager-build/qmanager.tar.gz
          test -f qmanager-build/sha256sum.txt
          tmp_check="$(mktemp -d)"
          tar -xzf qmanager-build/qmanager.tar.gz -C "$tmp_check" qmanager_install/scripts/usr/bin/qmanager_ping
          actual_ping_sha="$(sha256sum "$tmp_check/qmanager_install/scripts/usr/bin/qmanager_ping" | awk '{print $1}')"
          expected_ping_sha="$(sha256sum "$GITHUB_WORKSPACE/qmanager/casa_conversion/vendor/scripts/usr/bin/qmanager_ping" | awk '{print $1}')"
          if [ "$actual_ping_sha" != "$expected_ping_sha" ]; then
            echo "Packaged qmanager_ping SHA mismatch: expected $expected_ping_sha, got $actual_ping_sha" >&2
            exit 1
          fi
          rm -rf "$tmp_check"

      - name: Stage release assets
        if: steps.scheduled_check.outputs.should_build == 'true'
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          upstream_tag="${{ steps.resolve.outputs.upstream_tag }}"
          tar_name="${{ steps.resolve.outputs.tar_name }}"
          sha_name="${{ steps.resolve.outputs.sha_name }}"
          build_dir="qmanager/qmanager_work_${upstream_tag}_casa/qmanager-build"
          stage_dir="$RUNNER_TEMP/casa-release-assets"

          test -f "$build_dir/qmanager.tar.gz"
          test -f "$build_dir/sha256sum.txt"

          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          cp "$build_dir/qmanager.tar.gz" "$stage_dir/$tar_name"
          awk -v name="$tar_name" '{print $1 "  " name}' "$build_dir/sha256sum.txt" > "$stage_dir/$sha_name"

          (cd "$stage_dir" && sha256sum -c "$sha_name")
          tar tzf "$stage_dir/$tar_name" > "$stage_dir/tar-list.txt"
          grep -q '^qmanager_install/install_cfw3212.sh$' "$stage_dir/tar-list.txt"
          grep -q '^qmanager_install/uninstall_cfw3212.sh$' "$stage_dir/tar-list.txt"
          rm -f "$stage_dir/tar-list.txt"

          {
            echo "stage_dir=$stage_dir"
            echo "tar_path=$stage_dir/$tar_name"
            echo "sha_path=$stage_dir/$sha_name"
            echo "sha256=$(awk '{print $1}' "$stage_dir/$sha_name")"
          } >> "$GITHUB_OUTPUT"

          ls -lh "$stage_dir"

      - name: Upload workflow artifact
        if: steps.scheduled_check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: casa-cfw3212-${{ steps.resolve.outputs.casa_tag }}
          path: |
            ${{ steps.stage.outputs.tar_path }}
            ${{ steps.stage.outputs.sha_path }}
          if-no-files-found: error

      - name: Write release notes
        if: steps.scheduled_check.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/casa-release-assets/release-notes.md"
          cat > "$notes_file" <<'NOTES_EOF'
          Casa CFW-3212 conversion of dr-dolomite/QManager-RM520N UPSTREAM_TAG_PLACEHOLDER.

          Upstream release notes: https://github.com/dr-dolomite/QManager-RM520N/releases/tag/UPSTREAM_TAG_PLACEHOLDER

          Full Casa CFW-3212 changelog: https://github.com/Joetooley28/qmanager-casa-cfw3212-package/blob/main/CFW3212_JTOOLEY_CHANGELOG.md

          ## Credit

          QManager is built and maintained by **Rus | Ame** (`misuzu__` on Discord), GitHub **[dr-dolomite](https://github.com/dr-dolomite)**. Huge thanks to Rus for all the hard work building, maintaining, and sharing QManager with the community.

          Joetooley built only the Casa CFW-3212 converter/package flow and small UI compatibility changes needed to make QManager installable and usable on the Casa CFW-3212.

          Actions-built prerelease. Not yet live-router verified by JTooley.

          This is a prerelease for live-router validation before any manual stable promotion.

          Safety scope:
          - Casa install paths under /usrdata and /etc/systemd/system
          - HTTP 9080 and HTTPS 9000
          - /dev/smd11 with bundled atcli_smd11 (Rust)
          - no QCFG usbnet / ECM / MBIM / RNDIS exposure
          - no blind SIM profile auto-apply
          - no upstream IPPT QMAP modem writes

          SHA-256:
          SHA256_PLACEHOLDER

          ## Casa CFW-3212 Software Update Changelog

          CASA_CHANGELOG_PLACEHOLDER

          ## Install Or Update

          Use one of these two methods. Most Windows users should use PowerShell.

          ### Method 1: Router Has Internet

          SSH into the router from Windows PowerShell:

              ssh root@192.168.1.1

          Then run this on the router:

              curl -fsSL https://github.com/Joetooley28/qmanager-casa-cfw3212-package/releases/download/CASA_TAG_PLACEHOLDER/install-qmanager-cfw3212.sh | sh

          If curl fails, use wget instead:

              wget -qO- https://github.com/Joetooley28/qmanager-casa-cfw3212-package/releases/download/CASA_TAG_PLACEHOLDER/install-qmanager-cfw3212.sh | sh

          ### Method 2: Router Has No Internet

          Download `TAR_NAME_PLACEHOLDER` on Windows. Do not extract it on Windows. If Windows already opened/extracted it into a folder, go back to the folder that contains the original `.tar.gz` file.

          Then run these two commands from Windows PowerShell in that folder:

              scp -O .\TAR_NAME_PLACEHOLDER root@192.168.1.1:/tmp/qmanager.tar.gz
              ssh root@192.168.1.1 "rm -rf /tmp/qmanager_install && tar xzf /tmp/qmanager.tar.gz -C /tmp && sh /tmp/qmanager_install/install_cfw3212.sh"

          Linux/WSL users can use the same two-step flow:

              scp -O TAR_NAME_PLACEHOLDER root@192.168.1.1:/tmp/qmanager.tar.gz
              ssh root@192.168.1.1 "rm -rf /tmp/qmanager_install && tar xzf /tmp/qmanager.tar.gz -C /tmp && sh /tmp/qmanager_install/install_cfw3212.sh"

          ## Uninstall

          Default uninstall removes QManager services, `/usrdata/qmanager`, and QManager-installed binaries under `/usrdata/bin`. It preserves `/etc/qmanager` and `/usrdata/opt`.

          ### Online Uninstall

          SSH into the router from Windows PowerShell:

              ssh root@192.168.1.1

          Then run this on the router:

              curl -fsSL https://github.com/Joetooley28/qmanager-casa-cfw3212-package/releases/download/CASA_TAG_PLACEHOLDER/uninstall-qmanager-cfw3212.sh | sh

          If curl fails, use wget instead:

              wget -qO- https://github.com/Joetooley28/qmanager-casa-cfw3212-package/releases/download/CASA_TAG_PLACEHOLDER/uninstall-qmanager-cfw3212.sh | sh

          ### Offline Uninstall

          If the router has no internet, use the same downloaded `.tar.gz` and run these two commands from Windows PowerShell:

              scp -O .\TAR_NAME_PLACEHOLDER root@192.168.1.1:/tmp/qmanager.tar.gz
              ssh root@192.168.1.1 "rm -rf /tmp/qmanager_install && tar xzf /tmp/qmanager.tar.gz -C /tmp && sh /tmp/qmanager_install/uninstall_cfw3212.sh --force --no-reboot"

          Linux/WSL:

              scp -O TAR_NAME_PLACEHOLDER root@192.168.1.1:/tmp/qmanager.tar.gz
              ssh root@192.168.1.1 "rm -rf /tmp/qmanager_install && tar xzf /tmp/qmanager.tar.gz -C /tmp && sh /tmp/qmanager_install/uninstall_cfw3212.sh --force --no-reboot"

          ### Purge

          Add `--purge` only when you want to remove preserved QManager config, bundled Entware state, and optional QManager-installed tools too. Purge also removes Tailscale service/state/symlinks installed by QManager, root Ookla CLI config, and transient Tailscale logs:

              curl -fsSL https://github.com/Joetooley28/qmanager-casa-cfw3212-package/releases/download/CASA_TAG_PLACEHOLDER/uninstall-qmanager-cfw3212.sh | sh -s -- --purge

          Or with wget:

              wget -qO- https://github.com/Joetooley28/qmanager-casa-cfw3212-package/releases/download/CASA_TAG_PLACEHOLDER/uninstall-qmanager-cfw3212.sh | sh -s -- --purge

          Offline purge uses the same offline uninstall command with `--purge` appended.
          NOTES_EOF
          sed -i \
            -e "s|UPSTREAM_TAG_PLACEHOLDER|${{ steps.resolve.outputs.upstream_tag }}|g" \
            -e "s|SHA256_PLACEHOLDER|${{ steps.stage.outputs.sha256 }}|g" \
            -e "s|CASA_TAG_PLACEHOLDER|${{ steps.resolve.outputs.casa_tag }}|g" \
            -e "s|TAR_NAME_PLACEHOLDER|${{ steps.resolve.outputs.tar_name }}|g" \
            -e "s|CHANGELOG_NAME_PLACEHOLDER|${{ steps.resolve.outputs.changelog_name }}|g" \
            "$notes_file"

          python3 - "$notes_file" qmanager/casa_conversion/CFW3212_JTOOLEY_CHANGELOG.md <<'PY'
          import pathlib
          import sys

          notes_file = pathlib.Path(sys.argv[1])
          changelog_src = pathlib.Path(sys.argv[2])
          notes = notes_file.read_text()
          changelog = changelog_src.read_text().strip()
          if changelog.startswith("# Casa CFW-3212 Joetooley Changelog\n\n"):
              changelog = changelog.split("\n\n", 1)[1]
          sections = []
          current = []
          for line in changelog.splitlines():
              if line.startswith("## ") and current:
                  sections.append("\n".join(current).strip())
                  current = [line]
              else:
                  current.append(line)
          if current:
              sections.append("\n".join(current).strip())
          whats_working = [s for s in sections if s.startswith("## What's Working")]
          versions = [s for s in sections if s.startswith("## v")]
          changelog = "\n\n".join(whats_working[:1] + versions[:3])
          notes_file.write_text(notes.replace("CASA_CHANGELOG_PLACEHOLDER", changelog))
          PY

      - name: Write install scripts
        if: steps.scheduled_check.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/casa-release-assets"
          subst() {
            sed \
              -e "s|@@CASA_TAG@@|${{ steps.resolve.outputs.casa_tag }}|g" \
              -e "s|@@UPSTREAM_TAG@@|${{ steps.resolve.outputs.upstream_tag }}|g" \
              "$1" > "$2"
            chmod +x "$2"
          }
          subst qmanager/casa_conversion/templates/install-qmanager-cfw3212.sh.tmpl \
                 "$bundle_dir/install-qmanager-cfw3212.sh"
          subst qmanager/casa_conversion/templates/uninstall-qmanager-cfw3212.sh.tmpl \
                 "$bundle_dir/uninstall-qmanager-cfw3212.sh"

      - name: Write updater changelog asset
        if: steps.scheduled_check.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          changelog_src="qmanager/casa_conversion/CFW3212_JTOOLEY_CHANGELOG.md"
          changelog_asset="$RUNNER_TEMP/casa-release-assets/${{ steps.resolve.outputs.changelog_name }}"
          upstream_json="$RUNNER_TEMP/upstream-release-${{ steps.resolve.outputs.upstream_tag }}.json"

          if [ ! -f "$changelog_src" ]; then
            echo "Missing curated Casa changelog source: $changelog_src" >&2
            exit 1
          fi
          if ! grep -Fq "${{ steps.resolve.outputs.casa_tag }}" "$changelog_src"; then
            echo "::warning::Joetooley changelog not updated for ${{ steps.resolve.outputs.casa_tag }} — add a ## ${{ steps.resolve.outputs.casa_tag }} section to $changelog_src before router-verifying"
            _tmp_cl="$(mktemp)"
            printf '## %s\n\n[CHANGELOG PENDING] Joetooley notes for this release have not yet been written. Changelog will be updated after router verification.\n\n' \
              "${{ steps.resolve.outputs.casa_tag }}" > "$_tmp_cl"
            cat "$changelog_src" >> "$_tmp_cl"
            changelog_src="$_tmp_cl"
          fi

          gh api "repos/${UPSTREAM_REPO_SLUG}/releases/tags/${{ steps.resolve.outputs.upstream_tag }}" > "$upstream_json"

          python3 - \
            "$changelog_src" \
            "$upstream_json" \
            "$changelog_asset" \
            "${{ steps.resolve.outputs.casa_tag }}" \
            "${{ steps.resolve.outputs.upstream_tag }}" <<'PY'
          import json
          import pathlib
          import sys

          changelog_src = pathlib.Path(sys.argv[1])
          upstream_json = pathlib.Path(sys.argv[2])
          changelog_asset = pathlib.Path(sys.argv[3])
          casa_tag = sys.argv[4]
          upstream_tag = sys.argv[5]

          upstream = json.loads(upstream_json.read_text())
          payload = {
              "casa_tag": casa_tag,
              "upstream_tag": upstream_tag,
              "joetooley_notes": changelog_src.read_text().strip(),
              "upstream_notes": (upstream.get("body") or "").strip(),
              "upstream_release_url": upstream.get("html_url") or f"https://github.com/dr-dolomite/QManager-RM520N/releases/tag/{upstream_tag}",
          }
          changelog_asset.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n")
          PY

          python3 -m json.tool "$changelog_asset" >/dev/null

      - name: Upload publish bundle
        if: steps.scheduled_check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: casa-cfw3212-publish-${{ steps.resolve.outputs.casa_tag }}
          path: |
            ${{ steps.stage.outputs.tar_path }}
            ${{ steps.stage.outputs.sha_path }}
            ${{ runner.temp }}/casa-release-assets/install-qmanager-cfw3212.sh
            ${{ runner.temp }}/casa-release-assets/uninstall-qmanager-cfw3212.sh
            ${{ runner.temp }}/casa-release-assets/release-notes.md
            ${{ runner.temp }}/casa-release-assets/${{ steps.resolve.outputs.changelog_name }}
          if-no-files-found: error

      - name: Dry-run summary
        if: steps.scheduled_check.outputs.should_build == 'true' && (steps.inputs.outputs.create_release != 'true' || steps.inputs.outputs.dry_run == 'true')
        shell: bash
        run: |
          set -euo pipefail
          cat <<EOF
          Dry run complete. No GitHub Release was created or modified.

          Package repo: ${PACKAGE_REPO}
          Upstream repo: ${UPSTREAM_REPO_SLUG}
          Upstream tag: ${{ steps.resolve.outputs.upstream_tag }}
          Casa tag: ${{ steps.resolve.outputs.casa_tag }}
          Assets:
            ${{ steps.resolve.outputs.tar_name }}
            ${{ steps.resolve.outputs.sha_name }}
          SHA-256: ${{ steps.stage.outputs.sha256 }}
          EOF

  publish:
    name: Publish official package prerelease
    needs: build
    if: needs.build.outputs.should_build == 'true' && needs.build.outputs.create_release == 'true' && needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: official-package-release
    env:
      GH_TOKEN: ${{ secrets.PACKAGE_RELEASE_TOKEN }}
      PACKAGE_REPO: Joetooley28/qmanager-casa-cfw3212-package

    steps:
      - name: Require package release token
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "Joetooley28/qmanager-casa-cfw3212-builder" ]; then
            echo "Official publishing is only allowed from Joetooley28/qmanager-casa-cfw3212-builder." >&2
            echo "Forks can build downloadable artifacts but cannot publish official package releases." >&2
            exit 1
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            cat >&2 <<'EOF'
          Missing required environment secret: PACKAGE_RELEASE_TOKEN

          Create a protected GitHub Actions environment named
          official-package-release, require your approval, and add a
          fine-grained token with Contents write access only to
          Joetooley28/qmanager-casa-cfw3212-package.
          EOF
            exit 1
          fi

      - name: Download publish bundle
        uses: actions/download-artifact@v4
        with:
          name: casa-cfw3212-publish-${{ needs.build.outputs.casa_tag }}
          path: publish

      - name: Advance package repo HEAD for release date ordering
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          casa_tag="${{ needs.build.outputs.casa_tag }}"
          # GitHub sets a release's created_at from its target commit's date.
          # With a frozen package-repo HEAD, every release tag points at the same
          # commit and shares one created_at, so GitHub cannot order them by date
          # and buries higher build numbers (e.g. .10 below .9). Push a fresh
          # commit so target_commitish=main resolves to a new, current-dated
          # commit. Non-fatal: discovery also works via the numeric sort in the
          # on-device update CGI, so a failure here never blocks publishing.
          tmp_pkg="$(mktemp -d)"
          if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PACKAGE_REPO}.git" "$tmp_pkg"; then
            cd "$tmp_pkg"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p .release-tracking
            printf '%s built %s\n' "$casa_tag" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .release-tracking/last-build.txt
            git add .release-tracking/last-build.txt
            git commit --allow-empty -m "Release ${casa_tag}"
            if git push origin HEAD:main; then
              echo "Advanced package repo HEAD for $casa_tag"
            else
              echo "WARN: push to package repo main failed; relying on update.sh sort for ordering"
            fi
          else
            echo "WARN: could not clone package repo to advance HEAD; relying on update.sh sort"
          fi

      - name: Create or update prerelease
        shell: bash
        run: |
          set -euo pipefail

          casa_tag="${{ needs.build.outputs.casa_tag }}"
          tar_path="publish/${{ needs.build.outputs.tar_name }}"
          sha_path="publish/${{ needs.build.outputs.sha_name }}"
          install_script="publish/install-qmanager-cfw3212.sh"
          uninstall_script="publish/uninstall-qmanager-cfw3212.sh"
          notes_file="publish/release-notes.md"
          changelog_file="publish/${{ needs.build.outputs.changelog_name }}"
          force="${{ needs.build.outputs.force }}"

          require_file() {
            if [ ! -f "$1" ]; then
              echo "Missing publish bundle file: $1" >&2
              echo "Downloaded publish bundle contents:" >&2
              find publish -maxdepth 3 -type f -print | sort >&2
              exit 1
            fi
          }

          require_file "$tar_path"
          require_file "$sha_path"
          require_file "$install_script"
          require_file "$uninstall_script"
          require_file "$notes_file"
          require_file "$changelog_file"

          release_exists=false
          if gh release view "$casa_tag" --repo "$PACKAGE_REPO" >/dev/null 2>&1; then
            release_exists=true
          fi

          upload_assets() {
            upload_args=(
              "$casa_tag"
              "$tar_path"
              "$sha_path"
              "$install_script"
              "$uninstall_script"
              "$changelog_file"
              --repo "$PACKAGE_REPO"
            )
            if [ "$force" = "true" ]; then
              upload_args+=(--clobber)
            fi

            if ! gh release upload "${upload_args[@]}" > "$RUNNER_TEMP/upload-assets.out" 2> "$RUNNER_TEMP/upload-assets.err"; then
              echo "Failed to upload one or more release assets for $casa_tag." >&2
              cat "$RUNNER_TEMP/upload-assets.err" >&2
              if [ -s "$RUNNER_TEMP/upload-assets.out" ]; then
                cat "$RUNNER_TEMP/upload-assets.out" >&2
              fi
              exit 1
            fi

            echo "Uploaded package assets for $casa_tag."
          }

          if [ "$release_exists" = "true" ]; then
            if [ "$force" != "true" ]; then
              echo "Release exists and force=false; refusing to upload assets." >&2
              exit 1
            fi
            existing_prerelease="$(gh release view "$casa_tag" --repo "$PACKAGE_REPO" --json isPrerelease --jq '.isPrerelease')"
            if [ "$existing_prerelease" != "true" ]; then
              echo "Release $casa_tag already exists but is not a prerelease." >&2
              echo "Refusing to modify stable releases from automation." >&2
              exit 1
            fi

            release_id="$(gh release view "$casa_tag" --repo "$PACKAGE_REPO" --json databaseId --jq '.databaseId')"
            title="QManager ${casa_tag} for Casa CFW-3212 (Actions-built, unverified)"
            python3 -c 'import json, pathlib, sys; title, notes = sys.argv[1:3]; print(json.dumps({"name": title, "body": pathlib.Path(notes).read_text(), "prerelease": True, "make_latest": "false"}))' \
              "$title" "$notes_file" > "$RUNNER_TEMP/update-release.json"
            if ! gh api --method PATCH "repos/${PACKAGE_REPO}/releases/${release_id}" \
                -H "Content-Type: application/json" \
                --input "$RUNNER_TEMP/update-release.json" \
                > "$RUNNER_TEMP/update-release-response.json" \
                2> "$RUNNER_TEMP/update-release.err"; then
              echo "Failed to update release notes for $casa_tag in $PACKAGE_REPO." >&2
              cat "$RUNNER_TEMP/update-release.err" >&2
              if [ -s "$RUNNER_TEMP/update-release-response.json" ]; then
                cat "$RUNNER_TEMP/update-release-response.json" >&2
              fi
              exit 1
            fi
            echo "Updated package prerelease body for $casa_tag."

            upload_assets
          else
            title="QManager ${casa_tag} for Casa CFW-3212 (Actions-built, unverified)"

            python3 -c 'import json, pathlib, sys; tag, title, notes = sys.argv[1:4]; print(json.dumps({"tag_name": tag, "target_commitish": "main", "name": title, "body": pathlib.Path(notes).read_text(), "draft": False, "prerelease": True, "make_latest": "false"}))' \
              "$casa_tag" "$title" "$notes_file" > "$RUNNER_TEMP/create-release.json"

            if ! gh api --method POST "repos/${PACKAGE_REPO}/releases" \
                -H "Content-Type: application/json" \
                --input "$RUNNER_TEMP/create-release.json" \
                > "$RUNNER_TEMP/create-release-response.json" \
                2> "$RUNNER_TEMP/create-release.err"; then
              echo "Failed to create $casa_tag in $PACKAGE_REPO." >&2
              echo "Check that PACKAGE_RELEASE_TOKEN has Contents: Read and write on the package repo." >&2
              cat "$RUNNER_TEMP/create-release.err" >&2
              if [ -s "$RUNNER_TEMP/create-release-response.json" ]; then
                cat "$RUNNER_TEMP/create-release-response.json" >&2
              fi
              exit 1
            fi

            release_id="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$RUNNER_TEMP/create-release-response.json")"
            if [ -z "$release_id" ]; then
              echo "GitHub created no usable release id for $casa_tag." >&2
              cat "$RUNNER_TEMP/create-release-response.json" >&2
              exit 1
            fi
            echo "Created package prerelease $casa_tag with release id $release_id."

            upload_assets
          fi
